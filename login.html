<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Times New Roman', Times, serif;
        background: url(https://static.vecteezy.com/system/resources/previews/070/103/979/non_2x/sunlight-streaming-through-grand-architectural-interior-free-photo.jpg) no-repeat center center;
        background-size: cover;
    }
    .main-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;

    }
    .login-box {
        width: 500px;
        margin: auto;
        padding: 30px;
        border: 2px solid white;
        text-align: center;
        background: black;
        backdrop-filter: blur(10px);
        color: azure;
    }
    input, button {
        width: 80%;
        padding: 10px;
        margin: 10px auto;
        display: block;        
    }
    h1 { font-size: 40px; }
    p {font-size: 18px; }

    .footer {
        background: grey;
        color: bisque;
        text-align: center;
        padding: 20px;
        margin-top: 40px;
    }
    .footer a {
        display: block;
        margin: 8px 0;
        font-size: 16px;
    }

    .insta { color: #da3434; }
    .fb { color: #1877f2; }
    .linkedin { color: #cacccf; }

    .footer a:hover {
     text-decoration: underline;
    }     
</style>
</head>
<body>
    <div class="main-container">
        <div class="login-box">
            <h1> Login</h1>
            <form action="/login_user" method="POST">
                <label>Email ID</label>
                <input type="email" name="email" placeholder="Enter Email">
                <label>Password </label>
                <input type="password" name="password" placeholder="Enter password">
            <button type="submit">Login</button>
            </form>
        <p>Don't have an account
        <a href="/signup">Sign up</a>
        </p>
    <footer class="footer">
        <p> follow us</p>

        <a href="https://www.instagram.com/amaan_.i18?igsh=dHp2aDdrejNsd2F2&utm_source=ig_contact_invite" target="_blank" class="insta">Instagram</a>
        <a href="https://www.facebook.com/share/17PFVSJtU2/" target="_blank" class="fb">Facebook</a>
        <a href="https://www.linkedin.com/in/amaan-ibrahim-6a0068360?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="linkedin">linkedin</a>
    </footer>
        </div>
    </div>
</body>
</html>
