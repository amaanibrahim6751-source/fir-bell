<!DOCTYPE html>
<html>
<head>
    <title>Settings - IoT Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            margin: 10px 0;
            color: white;
            text-decoration: none;
            padding: 8px;
        }

        .sidebar a.active {
            background: white;
            color: black;
            border-radius: 5px;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 30px;
            background: #f1f5f9;
        }

        /* BOX */
        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            padding: 10px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #334155;
        }

        .msg {
            margin-top: 10px;
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>My IoT</h2>
    <a href="/dashboard">Dashboard</a>
    <a href="/about">About</a>
    <a href="/setting" class="active">Setting</a>
    <a href="/logout">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

    <h2>Settings</h2>

    <div class="box">
        <h3>Change Password</h3>

        <form action="/change_password" method="POST">
            <input type="password" name="oldPass" placeholder="Old Password" required>
            <input type="password" name="newPass" placeholder="New Password" required>

            <button type="submit">Update Password</button>
        </form>

        <!-- Flask message -->
        {% if msg %}
            <p class="msg {% if 'Wrong' in msg %}error{% endif %}">
                {{ msg }}
            </p>
        {% endif %}
    </div>

</div>

</body>
</html>
