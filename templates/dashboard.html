<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>IoT Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- 🔔 ONESIGNAL -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "ec4a8454-e9eb-476b-89a1-241575125240"
  });
});
</script>

<style>
body { margin:0; font-family:Arial; display:flex; }

.sidebar {
  width:220px; height:100vh;
  background:#1e293b; color:white; padding:20px;
}
.sidebar a {
  display:block; margin:10px 0; color:white; text-decoration:none; padding:8px;
}
.sidebar a.active { background:white; color:black; border-radius:5px; }

.main { flex:1; padding:20px; background:#f1f5f9; }

.alert-box {
  display:none;
  background:red; color:white;
  padding:10px;
  text-align:center;
  font-weight:bold;
}

.card-container { display:flex; gap:20px; margin-top:20px; }

.card {
  background:white; padding:20px;
  border-radius:10px; width:200px;
  text-align:center;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>My IoT</h2>
  <a href="/dashboard" class="active">Dashboard</a>
  <a href="/about">About</a>
  <a href="/setting">Setting</a>
  <a href="/logout">Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<div id="alertBox" class="alert-box">🔥 FIRE DETECTED!</div>

<h2>Dashboard</h2>

<div class="card-container">
  <div class="card">
    <h3>Temp</h3>
    <p id="temp">--</p>
  </div>

  <div class="card">
    <h3>Humidity</h3>
    <p id="hum">--</p>
  </div>

  <div class="card" id="fireCard">
    <h3>Fire</h3>
    <p id="fire">--</p>
  </div>
</div>

</div>

<!-- 🔊 ALARM SOUND -->
<audio id="alarmSound" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<!-- 🔥 REAL-TIME SCRIPT -->
<script>
let fireTriggered = false;

async function getData() {
  let res = await fetch('/data');
  let d = await res.json();

  document.getElementById("temp").innerText = d.temperature + "°C";
  document.getElementById("hum").innerText = d.humidity + "%";
  document.getElementById("fire").innerText = d.fire;

  if (d.fire === "FIRE" && !fireTriggered) {

    // UI ALERT
    document.getElementById("alertBox").style.display = "block";
    document.getElementById("fireCard").style.background = "red";
    document.getElementById("fireCard").style.color = "white";

    // 🔊 SOUND
    document.getElementById("alarmSound").play();

    // 🔔 ONESIGNAL
    OneSignal.sendSelfNotification(
      "🔥 FIRE ALERT!",
      "Fire detected in your system!",
      window.location.href
    );

    fireTriggered = true;

  } else if (d.fire === "NO") {

    document.getElementById("alertBox").style.display = "none";
    document.getElementById("fireCard").style.background = "white";
    document.getElementById("fireCard").style.color = "black";

    fireTriggered = false;
  }
}

setInterval(getData, 2000);
</script>

</body>
</html>
