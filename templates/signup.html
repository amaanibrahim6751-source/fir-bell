<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Times New Roman', Times, serif;
        background: url(https://png.pngtree.com/thumb_back/fw800/background/20260111/pngtree-sunlight-through-arches-in-a-large-empty-building-with-high-ceilings-image_21070913.webp) no-repeat center center;
        background-size: cover;
    }
 
.main-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.signup-box {
  width: 500px;
  margin: auto;
  padding: 30px;
  border: 2px solid white;
  text-align: left;

  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
  color: white;
}

input, button {
  width: 80%;
  padding: 10px;
  margin: 10px auto;
  display: block;
}

h2 {
  font-size: 40px;
}

p {
  font-size: 18px;
}

</style>
<body>
    <div class="main container">
        <div class="signup-box">
       <h2>Sign up</h2>
     <form method="POST" action="/register_user">

<label>Full Name:</label><br>
<input type="text" name="name" placeholder="Enter Your Full Name">

<label>Email:</label><br>
<input type="email" name="email" placeholder="Enter Your Email Address">

<label>Password:</label><br>
<input type="password" name="password" placeholder="Enter Your Password">

<label>Confirm Password:</label><br>
<input type="password" name="confirm_password" placeholder="Confirm Password">

<button type="submit">Create Account</button>

</form>

        <a href="https://www.facebook.com/share/17PFVSJtU2/" target="_blank" class="fb">Facebook</a>

    </footer>
        </div>
        </div>
    </div>
</body>
</html>
